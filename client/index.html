<!doctype html>

    <!-- display serif for the big 關於 / 課程內容 headings only: &text= makes Google send just these glyphs (a few KB) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&text=%E9%97%9C%E6%96%BC%E8%AA%B2%E7%A8%8B%E5%85%A7%E5%AE%B9%E5%AD%B8%E7%94%9F%E5%BF%83%E5%BE%97%E9%99%B3%E5%B0%8F%E5%A7%90%E6%9E%97%E5%85%88%E7%94%9F%E9%BB%83%E5%AA%BD%E5%AA%BD%E7%B2%BE%E5%BD%A9%E7%89%87%E6%AE%B5&display=swap" rel="stylesheet" />
    <script>
      // Sandboxed hosts (e.g. a shared prototype page) throw on ANY access to localStorage/sessionStorage.
      // Libraries that touch storage at load time would crash the app, so swap in an in-memory stand-in first.
      (function () {
        function mem() { var d = {}; return { getItem: function (k) { return k in d ? d[k] : null; }, setItem: function (k, v) { d[k] = String(v); },
          removeItem: function (k) { delete d[k]; }, clear: function () { d = {}; }, key: function (i) { return Object.keys(d)[i] || null; },
          get length() { return Object.keys(d).length; } }; }
        ['localStorage', 'sessionStorage'].forEach(function (name) {
          try { window[name].getItem('x'); }
          catch (e) { try { Object.defineProperty(window, name, { value: mem(), configurable: true }); } catch (e2) {} }
        });
        // crypto.randomUUID only exists in secure contexts; idempotency keys need it.
        if (window.crypto && typeof crypto.randomUUID !== 'function' && crypto.getRandomValues) {
          crypto.randomUUID = function () { var b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
            var h = Array.prototype.map.call(b, function (x) { return (x + 256).toString(16).slice(1); }).join('');
            return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20); };
        }
        // document.cookie throws in the same sandbox; the mock API reads it on every request.
        try { void document.cookie; }
        catch (e) { var jar = ''; try { Object.defineProperty(document, 'cookie', { get: function () { return jar; }, set: function () {}, configurable: true }); } catch (e2) {} }
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
